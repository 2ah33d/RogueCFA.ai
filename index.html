<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RogueCFA — AI Investment Scorecard</title>
    <meta name="description" content="Score any stock ticker against your intended hold period using live analyst data and AI. Free, BYOK, no account required." />
    <meta name="theme-color" content="#1E1F22" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"JetBrains Mono"', '"Roboto Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'sans-serif'],
            },
            borderRadius: {
              '2xl': '16px',
            },
            colors: {
              surface: {
                DEFAULT: 'rgb(var(--c-surface) / <alpha-value>)',
                card: 'rgb(var(--c-surface-card) / <alpha-value>)',
                elevated: 'rgb(var(--c-surface-elevated) / <alpha-value>)',
              },
              edge: 'rgb(var(--c-edge) / <alpha-value>)',
              prime: 'rgb(var(--c-prime) / <alpha-value>)',
              dim: 'rgb(var(--c-dim) / <alpha-value>)',
              faint: 'rgb(var(--c-faint) / <alpha-value>)',
              accent: {
                DEFAULT: 'rgb(var(--c-accent) / <alpha-value>)',
                hover: 'rgb(var(--c-accent-hover) / <alpha-value>)',
                muted: 'rgb(var(--c-accent-muted) / <alpha-value>)',
              },
              'signal-buy': 'rgb(var(--c-signal-buy) / <alpha-value>)',
              'signal-watch': 'rgb(var(--c-signal-watch) / <alpha-value>)',
              'signal-avoid': 'rgb(var(--c-signal-avoid) / <alpha-value>)',
              danger: 'rgb(var(--c-danger) / <alpha-value>)',
            },
            boxShadow: {
              'antigravity': '0 2px 10px rgba(0, 0, 0, 0.24)',
              'antigravity-hover': '0 6px 24px rgba(0, 0, 0, 0.35)',
              'antigravity-elevated': '0 8px 32px rgba(0, 0, 0, 0.45)',
            },
          },
        },
      };
    </script>
    <style>
      /* Pre-React background to prevent flash */
      body { background-color: #1E1F22; color: #E3E3E3; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; }

      /* ── Pick Card Modal Animations ── */
      @keyframes pickModalEnter {
        from { opacity: 0; transform: scale(0.85) translateY(12px); }
        to   { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes pickModalExit {
        from { opacity: 1; transform: scale(1) translateY(0); }
        to   { opacity: 0; transform: scale(0.9) translateY(8px); }
      }
      @keyframes backdropEnter {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes backdropExit {
        from { opacity: 1; }
        to   { opacity: 0; }
      }
      .pick-modal-enter {
        animation: pickModalEnter 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .pick-modal-exit {
        animation: pickModalExit 0.22s cubic-bezier(0.4, 0, 1, 1) both;
      }
      .pick-modal-backdrop-enter {
        animation: backdropEnter 0.25s ease-out both;
      }
      .pick-modal-backdrop-exit {
        animation: backdropExit 0.2s ease-in both;
      }

      /* ── Fade-in utility ── */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out both;
      }
    </style>
  </head>
  <body class="font-sans antialiased bg-surface text-prime">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
