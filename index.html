<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RogueCFA — AI Investment Scorecard</title>
    <meta name="description" content="Score any stock ticker against your intended hold period using live analyst data and AI. Free, BYOK, no account required." />
    <meta name="theme-color" content="#0C0C0D" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['JetBrains Mono', 'Menlo', 'monospace'],
            },
            colors: {
              surface: {
                DEFAULT: 'rgb(var(--c-surface) / <alpha-value>)',
                card: 'rgb(var(--c-surface-card) / <alpha-value>)',
                elevated: 'rgb(var(--c-surface-elevated) / <alpha-value>)',
              },
              edge: 'rgb(var(--c-edge) / <alpha-value>)',
              prime: 'rgb(var(--c-prime) / <alpha-value>)',
              dim: 'rgb(var(--c-dim) / <alpha-value>)',
              faint: 'rgb(var(--c-faint) / <alpha-value>)',
              accent: {
                DEFAULT: 'rgb(var(--c-accent) / <alpha-value>)',
                hover: 'rgb(var(--c-accent-hover) / <alpha-value>)',
                muted: 'rgb(var(--c-accent-muted) / <alpha-value>)',
              },
              'signal-buy': 'rgb(var(--c-signal-buy) / <alpha-value>)',
              'signal-watch': 'rgb(var(--c-signal-watch) / <alpha-value>)',
              'signal-avoid': 'rgb(var(--c-signal-avoid) / <alpha-value>)',
              danger: 'rgb(var(--c-danger) / <alpha-value>)',
            },
            boxShadow: {
              'linear-hover': '0 4px 20px rgba(0, 0, 0, 0.5)',
            },
          },
        },
      };
    </script>
    <style>
      /* Pre-React background to prevent flash */
      body { background-color: #0C0C0D; color: #EDEDED; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body class="font-sans antialiased bg-surface text-prime">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
